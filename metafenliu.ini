工作了 1m 9s
内核日志已经把原因写死了：

Parse config error: invalid find process mode
原文件里是：

find-process-mode: off
YAML 会把 off / on / yes / no 当成布尔值，解析结果变成 false，Mihomo 不认，直接起不来。Nikki 能吃，OpenClash 这版内核吃不了。

另外这份是 Nikki 写法：tun.auto-route/auto-redirect 全关。OpenClash 开 TUN 时必须让内核接管路由，否则即使解析过了，流量也会像日志里那样直连超时。

已改好的文件：


相对原文件只动了三处：

find-process-mode: "off"（加引号）
TUN：auto-route / auto-redirect / auto-detect-interface 改为 true
Fake-IP 网段改成常见的 198.18.0.1/16（28.0.0.1/8 在 OpenClash + dnsmasq 上容易别扭）
用法：

配置管理 → 上传 777-openclash.yaml → 选中
运行模式保持 TUN + Fake-IP + 规则
启动。不要再用旧的 777.yaml
启动后若还失败，把新的「内核日志」前 20 行贴出来。之前那些 Telegram/Google timeout 是核心已经挂了之后的残留拨号，不是节点本身的问题。

订阅 token 和 Hysteria 密码已经出现在这份明文配置里，用完建议在机场后台重置 token。

