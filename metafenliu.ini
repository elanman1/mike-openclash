协议 Hysteria2 + salamander
[custom] 这段加不进去节点地址。要自建生效，任选一种：

把自建节点加进机场订阅（节点名带「自建」或 Hysteria2）
或在 OpenClash 配置文件 YAML 的 proxies: 里保留那条 自建-Hysteria2，再跑规则生成器
只贴这份 ini、订阅里又没有同名节点，🔌 自建 就是空组，ChatGPT/AI 会自动落到 🇺🇸 US。





openclash-custom-han.ini

文件
[custom]
; ==========================================================
; 方案 A · 最终修正版 + 个人分流
; - GEOSITE / GEOIP 为主
; - 保留 HK / TW / JP / SG / US + 🧊 冷门
; - 个人规则：交易所/富途/Polymarket/darkbloom 默认台湾
; - AI / ChatGPT / Discord / Apple PCC 优先自建
; - part888 / part567 直连；qichiyu 走默认代理
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true
; ==========================================================
; 节点清洗
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website
; ==========================================================
; 1) 规则（自上而下）
