先看现有文件，再整份覆盖，避免手改漏字段。

# 1. 看现在有什么
ls -la ~/.config/darkbloom/provider.toml
cat ~/.config/darkbloom/provider.toml
# 2. 备份
cp ~/.config/darkbloom/provider.toml ~/.config/darkbloom/provider.toml.bak.$(date +%Y%m%d%H%M)
# 3. 整份写成下面这份（直接复制粘贴）
cat > ~/.config/darkbloom/provider.toml <<'EOF'
[provider]
name = "darkbloom-mac13-1"
memory_reserve_gb = 4
auto_update = true
auto_restart = true

[backend]
